name: 轮转 Preview 分支

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  rotate-preview:
    name: 从 Main 重建 Preview
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'preview' &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 通过 SSH Deploy Key 轮转 Preview 分支
        env:
          PREVIEW_ROTATE_DEPLOY_KEY: ${{ secrets.PREVIEW_ROTATE_DEPLOY_KEY }}
        shell: bash
        run: |
          if [ -z "$PREVIEW_ROTATE_DEPLOY_KEY" ]; then
            echo "PREVIEW_ROTATE_DEPLOY_KEY 未配置"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$PREVIEW_ROTATE_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git config user.name "preview-rotate-bot"
          git config user.email "preview-rotate-bot@users.noreply.github.com"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          git fetch origin main preview --prune

          if git ls-remote --exit-code --heads origin preview > /dev/null 2>&1; then
            git push origin --delete preview
          else
            echo "远端 Preview 分支不存在，跳过删除"
          fi

          git checkout -B preview origin/main
          git push --set-upstream origin preview
