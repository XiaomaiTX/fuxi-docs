name: Main Docker 部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.15.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行代码检查
        run: pnpm run lint

      - name: 构建 Rspress 站点
        run: pnpm run build

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成镜像标签
        id: image
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKER_HUB_REPO }}:latest
            ${{ vars.DOCKER_HUB_REPO }}:${{ steps.image.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 触发自托管部署
        env:
          DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_CI_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_CI_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET "$DEPLOY_WEBHOOK_URL" \
            --header "accept: application/json" \
            --header "x-api-key: $DEPLOY_WEBHOOK_TOKEN"
